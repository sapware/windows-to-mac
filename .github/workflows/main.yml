name: Build Mac Executable

on:
  workflow_dispatch: # Allows you to run this manually with a click of a button

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyinstaller pyautogui

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile prompts.py

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: mac-executable
        path: dist/
